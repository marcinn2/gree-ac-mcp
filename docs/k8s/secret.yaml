# The whole config.json is stored as a Secret because it contains the bearerToken.
# Do NOT commit a real token to version control. Prefer creating this from a file:
#
#   kubectl -n gree-ac create secret generic gree-ac-config \
#     --from-file=config.json=./config.json
#
# The manifest below is provided as an editable example (uses stringData so you can
# read/edit the JSON inline). Replace the bearerToken and devices before applying.
apiVersion: v1
kind: Secret
metadata:
  name: gree-ac-config
  namespace: gree-ac
type: Opaque
stringData:
  config.json: |
    {
      "bearerToken": "REPLACE-ME-WITH-A-LONG-RANDOM-SECRET",
      "udpPort": 7000,
      "updateInterval": 1000,
      "retryInterval": 5000,
      "host": "0.0.0.0",
      "port": 8080,
      "devices": [
        {
          "name": "AC-Office",
          "room": "Office",
          "address": "192.168.1.50",
          "mac": "1F1F1F1F1F1F",
          "model": "SH-12BIV",
          "minimumTargetTemperature": 16,
          "maximumTargetTemperature": 30,
          "oscillation": {
            "on": { "horizontal": "full", "vertical": "full" },
            "off": { "horizontal": "default", "vertical": "default" }
          },
          "xFan": true,
          "lightControl": true,
          "fakeSensor": true,
          "sensorOffset": 0,
          "speedSteps": 5,
          "encryptionVersion": 0
        }
      ]
    }
