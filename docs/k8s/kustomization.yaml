apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gree-ac

resources:
  - namespace.yaml
  - secret.yaml      # replace the placeholder bearerToken before applying
  - deployment.yaml
  - service.yaml
  - ingress.yaml     # optional; remove this line if you don't use an ingress

