# Cuts a release when a version tag is pushed:
#   1. builds the multi-arch image (linux/amd64 + linux/arm64) and pushes it to GHCR
#   2. creates a GitHub Release with auto-generated notes
#
# Trigger it by pushing a tag, e.g.:
#   npm version 1.1.0   # bumps package.json and creates the v1.1.0 tag
#   git push origin main --tags
#
# A pre-release tag (one containing a hyphen, e.g. v1.1.0-rc.1) is marked as a
# GitHub pre-release and does NOT move the ":latest" image tag.
name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      packages: write # push the image to GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Warn if package.json version does not match the tag
        run: |
          pkg="$(node -p "require('./package.json').version")"
          tag="${{ steps.version.outputs.version }}"
          if [ "$pkg" != "$tag" ]; then
            echo "::warning::Tag v$tag does not match package.json version $pkg; consider using 'npm version' so they stay in sync."
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # latest=auto -> ":latest" is applied only to non-pre-release tags.
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Skip attestation manifests so the GHCR package page stays clean
          # (drop these two lines to keep provenance/SBOM attestations).
          provenance: false
          sbom: false

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Container image

            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ```

            Multi-arch manifest covering `linux/amd64` and `linux/arm64`.
